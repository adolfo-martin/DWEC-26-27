<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter Product Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Visor de productos (OpenRouter)</h1>
    <p class="subtitle">Demo de consumo de la API de OpenRouter desde el navegador, sin backend.</p>
    <div class="config-bar">
      <label>API Key
        <input type="password" id="apiKeyInput" placeholder="sk-or-..." autocomplete="off">
      </label>
      <button id="saveKeyBtn" type="button">Guardar clave</button>
      <label>Traductor (Modelo A)
        <select id="translatorModel"></select>
      </label>
      <label>Generador (Modelo B)
        <select id="generatorModel"></select>
      </label>
    </div>
    <div id="globalStatus" class="status"></div>
  </header>

  <main>
    <section class="panel list-panel">
      <h2>Productos</h2>
      <label>Selecciona un producto
        <select id="productSelect">
          <option value="">-- Selecciona --</option>
        </select>
      </label>
      <div id="listStatus" class="status"></div>
      <button id="retryTranslateBtn" type="button" hidden>Reintentar traducción</button>
    </section>

    <section class="panel detail-panel" id="detailPanel">
      <p class="placeholder">Selecciona un producto para ver sus detalles.</p>
    </section>
  </main>

  <script src="config.example.js"></script>
  <script src="config.local.js" onerror="window.__noLocalConfig = true;"></script>
  <script src="app.js"></script>
</body>
</html>
