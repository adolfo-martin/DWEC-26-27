<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./products.js"></script>

    <style>
        table,
        tr,
        th,
        td {
            border: solid;
            border-collapse: collapse;
        }

        img {
            height: 50px;
        }

        header {
            font-size: 3rem;
        }

        #tSpnCart::after {
            content: attr(data-quantity);
        }

        table,
        tr,
        th,
        td {
            border: solid;
            border-collapse: collapse;
        }

        #tSpnCart+table {
            display: none;

        }

        #tSpnCart:hover+table {
            display: block;
            font-size: 1rem;
            background-color: aqua;
        }
    </style>
</head>

<body>
    <header>
        <span>Mercadillo Arcas</span>
        <span id="tSpnCart" data-quantity="0">🛒</span>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td><a href="./cart.html">Ver cesta</a></td>
                </tr>
            </tfoot>
        </table>
    </header>

    <main>
        <h1 id="tH1Category">Productos</h1>

        <table id="tTabProducts">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Imagen</th>
                    <th>Operación</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

</body>

</html>
